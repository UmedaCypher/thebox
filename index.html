<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Arcora — l'écrin de votre collection de montres</title>
    <meta name="description" content="Cataloguez vos montres, notez ce que vous portez chaque jour et partagez vos photos au poignet." />

    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <meta name="theme-color" content="#1f0e11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Arcora" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:title" content="Arcora" />
    <meta property="og:description" content="L'écrin numérique de votre collection de montres." />
    <meta property="og:type" content="website" />

    <script>
      // Applique le thème avant l'affichage pour éviter un flash.
      try {
        var t = localStorage.getItem('thebox-theme');
        if (t === 'soie') document.documentElement.setAttribute('data-theme', 'soie');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
